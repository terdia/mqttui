<div class="bg-gray-800 border border-gray-600 rounded p-4 mb-4" x-data="dryRunComponent({{ rule_id }})">
  <h4 class="text-md font-semibold mb-3">Dry-Run Test</h4>
  <div class="space-y-3">
    <div>
      <label class="block text-sm font-medium mb-1">Test Topic</label>
      <input type="text" x-model="topic" placeholder="sensors/room1/temperature"
             class="block w-full rounded bg-gray-700 border-gray-600 text-white text-sm p-2">
    </div>
    <div>
      <label class="block text-sm font-medium mb-1">Test Payload</label>
      <textarea x-model="payload" placeholder='{"temperature": 35, "unit": "C"}'
                class="block w-full rounded bg-gray-700 border-gray-600 text-white text-sm p-2" rows="3"></textarea>
    </div>
    <div class="flex gap-2">
      <button @click="runTest()" class="px-4 py-2 bg-purple-600 hover:bg-purple-700 rounded text-sm">Run Test</button>
      <button @click="$el.closest('#rule-form-container').innerHTML=''"
              class="px-4 py-2 bg-gray-600 hover:bg-gray-700 rounded text-sm">Close</button>
    </div>
    <!-- Results -->
    <div x-show="result !== null" class="mt-3 p-3 rounded" :class="result?.match ? 'bg-green-900/30 border border-green-600' : 'bg-red-900/30 border border-red-600'">
      <div class="font-medium mb-2" x-text="result?.match ? 'Rule WOULD fire' : 'Rule would NOT fire'"></div>
      <div class="text-sm space-y-1">
        <div>Topic match: <span :class="result?.topic_match ? 'text-green-400' : 'text-red-400'" x-text="result?.topic_match ? 'Yes' : 'No'"></span></div>
        <div>Condition match: <span :class="result?.condition_match ? 'text-green-400' : 'text-red-400'" x-text="result?.condition_match ? 'Yes' : 'No'"></span></div>
        <template x-if="result?.action_preview?.length > 0">
          <div class="mt-2">
            <div class="text-xs text-gray-400 mb-1">Action Preview:</div>
            <pre class="text-xs bg-gray-800 p-2 rounded overflow-x-auto" x-text="JSON.stringify(result.action_preview, null, 2)"></pre>
          </div>
        </template>
      </div>
    </div>
    <div x-show="error" class="mt-2 text-red-400 text-sm" x-text="error"></div>
  </div>
</div>
