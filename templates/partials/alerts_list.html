<div id="alerts-list">
  <!-- Filters -->
  <div class="flex flex-wrap gap-3 mb-4 items-end">
    <div>
      <label class="block text-xs text-gray-400 mb-1">Rule</label>
      <select name="rule_id" id="alert-filter-rule"
              hx-get="/partials/alerts"
              hx-target="#alerts-list"
              hx-swap="outerHTML"
              hx-include="#alert-filter-severity"
              class="rounded bg-gray-700 border-gray-600 text-white text-sm p-1.5">
        <option value="">All Rules</option>
        {% for rule in rules %}
        <option value="{{ rule.id }}" {{ 'selected' if current_rule_id == rule.id else '' }}>{{ rule.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div>
      <label class="block text-xs text-gray-400 mb-1">Severity</label>
      <select name="severity" id="alert-filter-severity"
              hx-get="/partials/alerts"
              hx-target="#alerts-list"
              hx-swap="outerHTML"
              hx-include="#alert-filter-rule"
              class="rounded bg-gray-700 border-gray-600 text-white text-sm p-1.5">
        <option value="">All</option>
        <option value="info" {{ 'selected' if current_severity == 'info' else '' }}>Info</option>
        <option value="warning" {{ 'selected' if current_severity == 'warning' else '' }}>Warning</option>
        <option value="critical" {{ 'selected' if current_severity == 'critical' else '' }}>Critical</option>
      </select>
    </div>
    <div class="text-sm text-gray-400">
      Showing {{ alerts|length }} of {{ total }} alerts
    </div>
  </div>

  <!-- Alert rows -->
  {% if alerts %}
  <div class="space-y-2">
    {% for alert in alerts %}
      {% include 'partials/alert_row.html' %}
    {% endfor %}
  </div>
  {% else %}
  <p class="text-gray-400 text-center py-8">No alerts recorded yet.</p>
  {% endif %}

  <!-- Pagination -->
  {% if has_next %}
  <div class="text-center mt-4">
    <button hx-get="/partials/alerts?page={{ page + 1 }}{% if current_rule_id %}&rule_id={{ current_rule_id }}{% endif %}{% if current_severity %}&severity={{ current_severity }}{% endif %}"
            hx-target="#alerts-list"
            hx-swap="outerHTML"
            class="px-4 py-2 bg-gray-700 hover:bg-gray-600 rounded text-sm">
      Load More (page {{ page + 1 }})
    </button>
  </div>
  {% endif %}
</div>
