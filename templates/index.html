<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MQTT Web Interface</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.7.0/chart.min.js"></script>
</head>
<body class="bg-gray-900 text-white overflow-hidden">
    <div class="flex h-screen">
        <!-- Collapsible Sidebar -->
        <div id="sidebar" class="w-80 bg-gray-900 border-r border-gray-700 transition-all duration-300 overflow-y-auto">
            <div class="p-4">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-xl font-bold">Controls</h2>
                    <button id="sidebar-toggle" class="p-2 bg-gray-700 hover:bg-gray-600 rounded">◀</button>
                </div>
                
                <!-- Advanced Search Panel -->
                <div class="bg-gray-800 rounded-lg shadow-md p-4 mb-4">
                    <div class="flex justify-between items-center mb-4 cursor-pointer" onclick="toggleAdvancedSearch()">
                        <h3 class="text-lg font-semibold">🔍 Advanced Search</h3>
                        <span id="search-toggle-icon" class="text-lg">▶</span>
                    </div>
                    <div id="advanced-search-content" class="hidden">
                    
                    <!-- Basic Topic Filter -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">Topic Filter</label>
                        <select id="topic-filter" class="block w-full rounded-md bg-gray-700 border-gray-600 text-white">
                            <option value="all">All Topics</option>
                        </select>
                    </div>
                    
                    <!-- Content Search -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">Content Search</label>
                        <input type="text" id="content-search" placeholder="Search message content..." class="block w-full rounded-md bg-gray-700 border-gray-600 text-white">
                    </div>
                    
                    <!-- Regex Topic Search -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">Regex Topic Pattern</label>
                        <input type="text" id="regex-topic" placeholder="sensors/.* or home/+/temp" class="block w-full rounded-md bg-gray-700 border-gray-600 text-white">
                    </div>
                    
                    <!-- JSON Path Search -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">JSON Path & Value</label>
                        <input type="text" id="json-path" placeholder="temperature or sensors.temp" class="block w-full mb-2 rounded-md bg-gray-700 border-gray-600 text-white">
                        <input type="text" id="json-value" placeholder="Expected value" class="block w-full rounded-md bg-gray-700 border-gray-600 text-white">
                    </div>
                    
                    <!-- Time Filter -->
                    <div class="mb-4">
                        <label class="block text-sm font-medium mb-2">Time Range (hours)</label>
                        <select id="time-filter" class="block w-full rounded-md bg-gray-700 border-gray-600 text-white">
                            <option value="">All Time</option>
                            <option value="1">Last Hour</option>
                            <option value="6">Last 6 Hours</option>
                            <option value="24">Last 24 Hours</option>
                            <option value="168">Last Week</option>
                        </select>
                    </div>
                    
                    <!-- Search Actions -->
                    <div class="space-y-2">
                        <button id="apply-filters-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded">Apply Filters</button>
                        <button id="clear-filters-btn" class="w-full bg-gray-600 hover:bg-gray-700 text-white py-2 px-4 rounded">Clear All</button>
                    </div>
                    
                    <!-- Filter Presets -->
                    <div class="mt-4 pt-4 border-t border-gray-600">
                        <label class="block text-sm font-medium mb-2">Filter Presets</label>
                        <select id="preset-select" class="block w-full mb-2 rounded-md bg-gray-700 border-gray-600 text-white">
                            <option value="">Select a preset...</option>
                        </select>
                        <div class="flex space-x-2">
                            <button id="load-preset-btn" class="flex-1 bg-green-600 hover:bg-green-700 text-white py-1 px-2 rounded text-sm">Load</button>
                            <button id="save-preset-btn" class="flex-1 bg-yellow-600 hover:bg-yellow-700 text-white py-1 px-2 rounded text-sm">Save</button>
                        </div>
                    </div>
                    </div>
                </div>
                
                <!-- Stats -->
                <div class="bg-gray-800 rounded-lg shadow-md p-4 mb-4">
                    <h3 class="text-lg font-semibold mb-3">📊 Stats</h3>
                    <div class="space-y-1 text-sm">
                        <p>Connections: <span id="connection-count" class="font-bold text-green-400">0</span></p>
                        <p>Topics: <span id="topic-count" class="font-bold text-blue-400">0</span></p>
                        <p>Messages: <span id="message-count" class="font-bold text-yellow-400">0</span></p>
                    </div>
                </div>
                
                <!-- Message Rate Chart -->
                <div class="bg-gray-800 rounded-lg shadow-md p-4 mb-4">
                    <h3 class="text-lg font-semibold mb-2">📈 Message Rate</h3>
                    <div class="h-32">
                        <canvas id="messageChart"></canvas>
                    </div>
                </div>
                
                <!-- Publish -->
                <div class="bg-gray-800 rounded-lg shadow-md p-4">
                    <h3 class="text-lg font-semibold mb-3">📤 Publish</h3>
                    <form id="publish-form" class="space-y-2">
                        <input type="text" id="topic" name="topic" placeholder="Topic" required class="block w-full rounded-md bg-gray-700 border-gray-600 text-white text-sm">
                        <textarea id="message" name="message" placeholder="Message" required class="block w-full rounded-md bg-gray-700 border-gray-600 text-white text-sm" rows="2"></textarea>
                        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded text-sm">Publish</button>
                    </form>
                </div>
            </div>
        </div>
        
        <!-- Main Content Area -->
        <div class="flex-1 flex flex-col">
            <!-- Header -->
            <div class="p-4 border-b border-gray-700">
                <div class="flex justify-between items-center">
                    <h1 class="text-2xl font-bold">MQTT Web Interface</h1>
                    <button id="sidebar-show" class="hidden p-2 bg-gray-700 hover:bg-gray-600 rounded">▶ Show Controls</button>
                </div>
            </div>
            
            <!-- Content Area -->
            <div class="flex-1 p-4 flex flex-col gap-4 overflow-hidden">
                <!-- Message Flow -->
                <div class="bg-gray-800 rounded-lg shadow-md p-4 flex-1 flex flex-col">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="text-xl font-semibold">Message Flow</h2>
                        <div class="flex space-x-2">
                            <button id="fullscreen-btn" class="px-3 py-1 bg-blue-600 hover:bg-blue-700 rounded text-sm">⛶ Fullscreen</button>
                            <button id="reset-nodes-btn" class="px-3 py-1 bg-green-600 hover:bg-green-700 rounded text-sm">⟲ Reset</button>
                        </div>
                    </div>
                    <div id="network-visualization" class="flex-1 border border-gray-600 rounded"></div>
                </div>
                
                <!-- Messages -->
                <div class="bg-gray-800 rounded-lg shadow-md p-4 flex-1 flex flex-col">
                    <h3 class="text-xl font-semibold mb-4">💬 Messages</h3>
                    <div id="message-list" class="flex-1 overflow-y-auto space-y-2"></div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
    function toggleSidebar() {
        const sidebar = document.getElementById('sidebar');
        const showBtn = document.getElementById('sidebar-show');
        
        if (sidebar.classList.contains('w-0')) {
            sidebar.classList.remove('w-0', 'overflow-hidden');
            sidebar.classList.add('w-80');
            showBtn.classList.add('hidden');
        } else {
            sidebar.classList.remove('w-80');
            sidebar.classList.add('w-0', 'overflow-hidden');
            showBtn.classList.remove('hidden');
        }
    }
    
    document.addEventListener('DOMContentLoaded', function() {
        document.getElementById('sidebar-toggle').addEventListener('click', toggleSidebar);
        document.getElementById('sidebar-show').addEventListener('click', toggleSidebar);
    });
    </script>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
