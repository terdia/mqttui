services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9002:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  mosquitto2:
    image: eclipse-mosquitto:latest
    container_name: mosquitto2
    ports:
      - "1884:1883"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  web:
    container_name: mqttui
    build: .
    ports:
      - "8088:5000"
    environment:
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=5000
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=
      - MQTT_PASSWORD=
      - MQTT_KEEPALIVE=60
      - MQTT_VERSION=3.1.1
      - SECRET_KEY=mqttui-dev-secret-change-in-prod
      - LOG_LEVEL=INFO
      - MQTT_TOPICS=#
      - DB_ENABLED=True
      - DB_PATH=/app/data/mqtt_messages.db
      - DB_MAX_MESSAGES=10000
      - DB_CLEANUP_DAYS=30
      - MQTTUI_ADMIN_USER=admin
      - MQTTUI_ADMIN_PASSWORD=admin
      - MQTTUI_RATE_LIMIT=30/minute
    volumes:
      - mqtt-data:/app/data
    depends_on:
      - mosquitto

volumes:
  mqtt-data: