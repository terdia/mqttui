services:
  mosquitto:
    image: eclipse-mosquitto:latest
    container_name: mosquitto
    ports:
      - "1883:1883"
      - "9002:9001"
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf

  web:
    container_name: mqttui
    build: .
    ports:
      - "8088:5000"
    environment:
      - DEBUG=False
      - HOST=0.0.0.0
      - PORT=5000
      - MQTT_BROKER=mosquitto
      - MQTT_PORT=1883
      - MQTT_USERNAME=
      - MQTT_PASSWORD=
      - MQTT_KEEPALIVE=60
      - MQTT_VERSION=3.1.1
      - SECRET_KEY=your-secret-key
      - LOG_LEVEL=INFO
      - MQTT_TOPICS=#
      - DB_ENABLED=True
      - DB_PATH=/app/data/mqtt_messages.db
      - DB_MAX_MESSAGES=10000
      - DB_CLEANUP_DAYS=30
    volumes:
      - ./:/app
    depends_on:
      - mosquitto